<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline · Tiktoe</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #080914; color: #eef0ff;
         font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 1.5rem; }
  .card { max-width: 22rem; padding: 2rem 1.5rem; border-radius: 1.5rem; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .1); }
  h1 { font-size: 1.5rem; margin: .5rem 0; }
  p { color: #a0a6c4; margin: 0 0 1.5rem; }
  button { min-height: 3rem; padding: 0 1.5rem; border: 0; border-radius: 1rem; font: inherit; font-weight: 600; color: #fff;
           background: linear-gradient(135deg, #7c3aed, #db2777); cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>Tiktoe needs a connection to play with friends. Check your Wi-Fi or data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
